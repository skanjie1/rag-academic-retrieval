embedding:
  base_model: "sentence-transformers/all-MiniLM-L6-v2"
  fine_tuned_model: "models/finetuned-minilm-nlp-abstracts"
  embedding_dim: 384
  batch_size: 64

retrieval:
  top_k: 5
  similarity_threshold: 0.65
  index_type: "FlatIP"  # Inner product for cosine similarity (normalized vectors)

chunking:
  chunk_size: 512
  chunk_overlap: 50
  separator: "\n\n"

generation:
  llm_model: "gpt-3.5-turbo"
  temperature: 0.1
  max_tokens: 500

fine_tuning:
  epochs: 3
  learning_rate: 2e-5
  warmup_ratio: 0.1
  batch_size: 32
  evaluation_steps: 100

data:
  corpus_path: "data/nlp_abstracts.json"
  eval_queries_path: "data/eval_queries.json"
  index_path: "data/faiss_index"
